name: Activate Supabase synchronization
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-supabase-sync.yml'
      - 'supabase-sync.js'
      - 'exam-ui-enhancements.js'
      - 'supabase-config.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Include Supabase scripts in index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path('index.html')
          if not f.is_file():
              raise SystemExit('index.html missing from repo root')
          s=f.read_text(encoding='utf-8')
          scripts=['supabase-config.js','supabase-sync.js','exam-ui-enhancements.js']
          if '</body>' not in s:
              raise SystemExit('HTML has no </body> tag')
          for script in scripts:
              tag='<script src="'+script+'"></script>'
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>',1)
                  print('Added',script)
          f.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized page
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Load Supabase multiuser bridge on EnglishSmart page"
            git push
          fi
