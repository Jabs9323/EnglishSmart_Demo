<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EnglishSmart Assessment</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#172a40;margin:0}main{max-width:600px;margin:16vh auto;padding:25px}h1{font-size:29px}p{color:#607188}button{padding:12px 20px;border:0;border-radius:10px;background:#172a40;color:#fff;cursor:pointer}</style></head><body><main id="loading"><h1>EnglishSmart Assessment</h1><p>Loading the interactive assessment…</p></main><script>
(async()=>{
 try{
  const res=await fetch('./app-source.html',{cache:'no-cache'});
  if(!res.ok)throw Error('Could not load assessment ('+res.status+')');
  let html=await res.text();
  const styles='<link rel="stylesheet" href="./englishsmart-theme.css">';
  const scripts=['supabase-config.js','supabase-sync.js','exam-ui-enhancements.js','englishsmart-theme.js']
    .map(src=>'<scr'+'ipt src="./'+src+'"></scr'+'ipt>').join('');
  html=html.replace('</head>',styles+'</head>').replace('</body>',scripts+'</body>');
  document.open();document.write(html);document.close();
 }catch(err){
  console.error(err);
  document.getElementById('loading').innerHTML='<h1>EnglishSmart</h1><p>Unable to load. Please refresh this page.</p><button onclick="location.reload()">Retry</button>';
 }
})();
</script></body></html>
